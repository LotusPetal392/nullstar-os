name: Integrate ring 3 userspace

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Apply ring 3 integration
        shell: bash
        run: |
          set -o pipefail
          python3 tools/integrate_ring3.py 2>&1 | tee ring3-integration.log

      - name: Format all sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Generate workspace lockfile
        run: cargo +nightly-2026-02-01 generate-lockfile

      - name: Commit integrated sources
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add Cargo.lock kernel/src/main.rs kernel/src/shell.rs src/main.rs userspace
          if ! git diff --cached --quiet; then
            git commit -m "Integrate first ring 3 process"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Build bootable image
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 build --locked 2>&1 | tee ring3-build.log

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ring3-integration-log
          path: ring3-integration.log
          if-no-files-found: ignore

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ring3-build-log
          path: ring3-build.log
          if-no-files-found: ignore
