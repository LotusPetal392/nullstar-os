name: Phase 1 quick validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  quick-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component clippy \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt \
            --target x86_64-unknown-none
      - name: Run host tests, Clippy, and release build
        shell: bash
        run: |
          set -o pipefail
          ./scripts/check-local.sh --quick 2>&1 | tee phase1-quick-validation.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase1-quick-validation-log
          path: phase1-quick-validation.log
          if-no-files-found: warn
