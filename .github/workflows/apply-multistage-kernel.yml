name: Apply multi-stage kernel patch

on:
  push:
    branches:
      - agent/multistage-userspace-pipelines
    paths:
      - tools/apply_multistage_kernel.patch
      - .github/workflows/apply-multistage-kernel.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/multistage-userspace-pipelines
          fetch-depth: 0

      - name: Apply and validate kernel patch
        run: |
          git apply --check tools/apply_multistage_kernel.patch
          git apply tools/apply_multistage_kernel.patch
          git diff --check

      - name: Commit kernel verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel/src/main.rs
          git commit -m "Verify multi-stage userspace pipelines"
          git push origin HEAD:agent/multistage-userspace-pipelines
