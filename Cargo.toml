[workspace]
resolver = "3"
members = ["kernel", "userspace"]

[package]
name = "nullstar-os"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LotusPetal392/nullstar-os"

[build-dependencies]
bootloader = "0.11.15"

kernel = {
    path = "kernel",
    artifact = "bin",
    target = "x86_64-unknown-none"
}

userspace = {
    path = "userspace",
    artifact = "bin",
    target = "x86_64-unknown-none"
}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
