name: Kernel QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  qemu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: agent/userspace-signals

      - name: Apply userspace process-group integration
        shell: python
        run: |
          import base64
          import gzip
          from pathlib import Path

          payload = Path("tools/userspace_signals_payload.part0").read_text().strip()
          workflow = Path(".github/workflows/apply-userspace-signals.yml").read_text().splitlines()
          start = next(index for index, line in enumerate(workflow) if "<<'PAYLOAD'" in line) + 1
          end = next(index for index in range(start, len(workflow)) if workflow[index].strip() == "PAYLOAD")
          payload += "".join(line.strip() for line in workflow[start:end])
          script = gzip.decompress(base64.b64decode(payload))
          Path("tools/apply_userspace_signals.py").write_bytes(script)
          exec(compile(script, "tools/apply_userspace_signals.py", "exec"))

          terminal_path = Path("kernel/src/process/terminal.rs")
          terminal = terminal_path.read_text()
          broken = "self.committed.push_back(b'\n');"
          fixed = r"self.committed.push_back(b'\n');"
          if terminal.count(broken) != 1:
              raise SystemExit("expected one generated newline byte literal")
          terminal_path.write_text(terminal.replace(broken, fixed, 1))
          Path("tools/userspace_signals_payload.part0").unlink()

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Format and validate
        run: |
          cargo +nightly-2026-02-01 fmt --all
          cargo +nightly-2026-02-01 fmt --all -- --check
          git diff --check

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet qemu-system-x86

      - name: Build bootable image
        run: cargo +nightly-2026-02-01 build --locked --quiet

      - name: Boot process-group and signal smoke test in QEMU
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 run --locked --quiet -- --test 2>&1 | tee partition-fat-qemu.log

      - name: Restore CI and commit product changes
        shell: bash
        run: |
          cat > .github/workflows/kernel-qemu.yml <<'WORKFLOW'
          name: Kernel QEMU smoke test

          on:
            pull_request:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            qemu-smoke-test:
              runs-on: ubuntu-latest
              timeout-minutes: 15

              steps:
                - name: Check out repository
                  uses: actions/checkout@v7

                - name: Install pinned Rust toolchain
                  run: |
                    rustup -q toolchain install nightly-2026-02-01 \
                      --profile minimal \
                      --component llvm-tools-preview \
                      --component rust-src \
                      --component rustfmt
                    rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

                - name: Check formatting
                  run: cargo +nightly-2026-02-01 fmt --all -- --check

                - name: Install QEMU
                  run: |
                    sudo apt-get update -qq
                    sudo apt-get install --yes --quiet qemu-system-x86

                - name: Build bootable image
                  run: cargo +nightly-2026-02-01 build --locked --quiet

                - name: Boot partition and FAT smoke test in QEMU
                  shell: bash
                  run: |
                    set -o pipefail
                    cargo +nightly-2026-02-01 run --locked --quiet -- --test 2>&1 | tee partition-fat-qemu.log

                - name: Upload runtime diagnostics
                  if: always()
                  uses: actions/upload-artifact@v6
                  with:
                    name: partition-fat-qemu-log
                    path: partition-fat-qemu.log
                    if-no-files-found: ignore
          WORKFLOW
          git config user.name lotuspetalagent
          git config user.email lotuspetalagent@users.noreply.github.com
          git add -A
          git commit -m "Add userspace process groups and signals"
          git push origin HEAD:agent/userspace-signals

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partition-fat-qemu-log
          path: partition-fat-qemu.log
          if-no-files-found: ignore
