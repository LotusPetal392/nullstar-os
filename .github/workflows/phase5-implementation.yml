name: Phase 5 implementation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase5-blocking-ipc

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase5-blocking-ipc
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component clippy \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt \
            --target x86_64-unknown-none
      - name: Implement blocking endpoint waits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "shared/userspace_abi.rs",
              "pub const ABI_VERSION_MINOR: u64 = 2;",
              "pub const ABI_VERSION_MINOR: u64 = 3;",
          )
          replace(
              "shared/userspace_abi.rs",
              "    // Capability and IPC ABI v1. Kernel operations are deliberately bounded\n    // and non-blocking; the userspace facade provides cooperative blocking\n    // helpers by yielding on TRY_AGAIN.",
              "    // Capability and IPC ABI v1. Data movement remains bounded and\n    // non-blocking. ABI 1.3 adds a scheduler-integrated endpoint readiness wait\n    // used by the userspace facade before retrying receive.",
          )
          replace(
              "shared/userspace_abi.rs",
              "    pub const SHARED_MEMORY_WRITE: u64 = 46;\n",
              "    pub const SHARED_MEMORY_WRITE: u64 = 46;\n    pub const ENDPOINT_WAIT: u64 = 47;\n",
          )

          replace(
              "kernel/src/process/userspace_platform/capability_entry.rs",
              "struct EndpointObject {\n    queue: alloc::collections::VecDeque<EndpointMessage>,\n}",
              "struct EndpointObject {\n    queue: alloc::collections::VecDeque<EndpointMessage>,\n    waiters: alloc::collections::VecDeque<u64>,\n}",
          )
          replace(
              "kernel/src/process/userspace_platform/capability_entry.rs",
              "    registry\n        .tables\n        .retain(|table| live_processes.contains(&table.process_id));\n    registry.collect_garbage();",
              "    registry\n        .tables\n        .retain(|table| live_processes.contains(&table.process_id));\n    for record in &mut registry.objects {\n        if let CapabilityObjectData::Endpoint(endpoint) = &mut record.data {\n            endpoint\n                .waiters\n                .retain(|process_id| live_processes.contains(process_id));\n        }\n    }\n    registry.collect_garbage();",
          )
          replace(
              "kernel/src/process/userspace_platform/capability_entry.rs",
              "            | abi::syscall::ENDPOINT_RECEIVE\n",
              "            | abi::syscall::ENDPOINT_RECEIVE\n            | abi::syscall::ENDPOINT_WAIT\n",
          )
          replace(
              "kernel/src/process/userspace_platform/capability_entry.rs",
              "    if syscall_number != abi::syscall::SYSTEM_INFO {\n        capability_reap_dead_processes();\n    }\n\n    let registers = unsafe { &mut *registers_pointer };",
              "    if syscall_number != abi::syscall::SYSTEM_INFO {\n        capability_reap_dead_processes();\n    }\n\n    if syscall_number == abi::syscall::ENDPOINT_WAIT {\n        let endpoint_handle = unsafe { (*registers_pointer).rdi };\n        return endpoint_wait(\n            process_id,\n            endpoint_handle,\n            current_stack_pointer,\n            registers_pointer,\n        );\n    }\n\n    let registers = unsafe { &mut *registers_pointer };",
          )
          replace(
              "kernel/src/process/userspace_platform/capability_entry.rs",
              "        CapabilityObjectData::Endpoint(EndpointObject {\n            queue: alloc::collections::VecDeque::with_capacity(\n                abi::limits::MAX_ENDPOINT_MESSAGES,\n            ),\n        }),",
              "        CapabilityObjectData::Endpoint(EndpointObject {\n            queue: alloc::collections::VecDeque::with_capacity(\n                abi::limits::MAX_ENDPOINT_MESSAGES,\n            ),\n            waiters: alloc::collections::VecDeque::new(),\n        }),",
          )
          replace(
              "kernel/src/process/userspace_platform/capability_entry.rs",
              "    endpoint.queue.push_back(EndpointMessage {\n        sender_process_id: process_id,\n        bytes,\n        capability: transfer,\n    });\n    0\n}\n\nfn endpoint_receive(",
              "    endpoint.queue.push_back(EndpointMessage {\n        sender_process_id: process_id,\n        bytes,\n        capability: transfer,\n    });\n    let waiter = endpoint.waiters.pop_front();\n    drop(registry);\n    if let Some(waiter_process_id) = waiter {\n        let _ = scheduler::wake_process(waiter_process_id);\n    }\n    0\n}\n\nfn endpoint_wait(\n    process_id: u64,\n    endpoint_handle: u64,\n    current_stack_pointer: usize,\n    registers_pointer: *mut SavedRegisters,\n) -> usize {\n    let mut registry = CAPABILITY_REGISTRY.lock();\n    let Some(endpoint_entry) = registry.entry(process_id, endpoint_handle) else {\n        unsafe { (*registers_pointer).rax = error_return(abi::errno::BAD_FILE_DESCRIPTOR) };\n        return current_stack_pointer;\n    };\n    if let Err(error) = capability_has_right(endpoint_entry, abi::capability::RIGHT_RECEIVE) {\n        unsafe { (*registers_pointer).rax = error_return(error) };\n        return current_stack_pointer;\n    }\n    if endpoint_entry.object.kind != abi::capability::KIND_ENDPOINT {\n        unsafe { (*registers_pointer).rax = error_return(abi::errno::INVALID_ARGUMENT) };\n        return current_stack_pointer;\n    }\n    let Some(object_index) = registry.object_index(endpoint_entry.object) else {\n        unsafe { (*registers_pointer).rax = error_return(abi::errno::IO) };\n        return current_stack_pointer;\n    };\n\n    for record in &mut registry.objects {\n        if let CapabilityObjectData::Endpoint(endpoint) = &mut record.data {\n            endpoint.waiters.retain(|waiter| *waiter != process_id);\n        }\n    }\n    let CapabilityObjectData::Endpoint(endpoint) = &mut registry.objects[object_index].data else {\n        unsafe { (*registers_pointer).rax = error_return(abi::errno::INVALID_ARGUMENT) };\n        return current_stack_pointer;\n    };\n    if !endpoint.queue.is_empty() {\n        unsafe { (*registers_pointer).rax = 0 };\n        return current_stack_pointer;\n    }\n    endpoint.waiters.push_back(process_id);\n    unsafe { (*registers_pointer).rax = 0 };\n    let next_stack_pointer = scheduler::block_current(current_stack_pointer);\n    drop(registry);\n    next_stack_pointer\n}\n\nfn endpoint_receive(",
          )

          replace(
              "userspace/src/ipc.rs",
              "//! Kernel operations are non-blocking. `receive`, `notification_wait`, and\n//! `wait_for_handle` add cooperative blocking facades by yielding whenever the\n//! requested state is not ready.",
              "//! Data movement syscalls remain non-blocking. `receive` uses the ABI 1.3\n//! scheduler-integrated endpoint wait before retrying, while notification and\n//! capability-table discovery retain cooperative yield-based waits.",
          )
          replace(
              "userspace/src/ipc.rs",
              "pub fn receive(endpoint: CapabilityHandle, buffer: &mut [u8]) -> Result<ReceivedMessage> {\n    loop {\n        match try_receive(endpoint, buffer) {\n            Ok(message) => return Ok(message),\n            Err(error) if error == Error::TRY_AGAIN => {\n                if crate::syscall::yield_now().is_err() {\n                    return Err(Error::IO);\n                }\n            }\n            Err(error) => return Err(error),\n        }\n    }\n}",
              "pub fn endpoint_wait(endpoint: CapabilityHandle) -> Result<()> {\n    let mut result = syscall::ENDPOINT_WAIT;\n    unsafe {\n        asm!(\n            \"int 0x80\",\n            inlateout(\"rax\") result,\n            in(\"rdi\") endpoint,\n        );\n    }\n    decode(result).map(|_| ())\n}\n\npub fn receive(endpoint: CapabilityHandle, buffer: &mut [u8]) -> Result<ReceivedMessage> {\n    loop {\n        match try_receive(endpoint, buffer) {\n            Ok(message) => return Ok(message),\n            Err(error) if error == Error::TRY_AGAIN => endpoint_wait(endpoint)?,\n            Err(error) => return Err(error),\n        }\n    }\n}",
          )

          docs = Path("docs/blocking-ipc.md")
          docs.write_text("""# Blocking endpoint waits\n\nPhase 5 adds a scheduler-integrated readiness wait for capability endpoints.\n\n## Contract\n\n`ENDPOINT_WAIT` validates that the caller holds `RECEIVE` authority. If the endpoint already contains a message, it returns immediately. Otherwise the kernel registers the process as a waiter and marks its scheduler task blocked.\n\n`ENDPOINT_SEND` queues the bounded message, removes one waiter in FIFO order, releases the capability-registry lock, and wakes that process. Userspace then retries the non-blocking receive syscall.\n\nThe wait is intentionally readiness-based rather than a combined receive operation. A wake may be spurious, or another receiver may consume the message first, so callers must always retry receive in a loop. This also makes signal-induced wakeups safe without committing partially copied output or transferred capabilities.\n\n## Lost-wakeup avoidance\n\nWaiter registration and scheduler blocking happen while the endpoint registry remains locked. A sender cannot enqueue and attempt a wake between those two actions. The sender releases the registry before acquiring scheduler state to wake a process.\n\n## Cancellation and cleanup\n\nA process is removed from any previous endpoint wait queue before registering a new wait. Dead-process capability cleanup also removes stale waiter records. Signals or other scheduler events may wake a blocked process; the userspace receive facade simply rechecks the endpoint and waits again when it remains empty.\n\n## Current boundary\n\nThis primitive removes cooperative polling from endpoint receive and is the blocking foundation for the future kernel-to-userspace VFS proxy. It does not yet provide transaction identifiers, kernel-owned reply slots, request cancellation messages, timeout deadlines, or restart-aware kernel file descriptors.\n""")
          PY
          cargo +nightly-2026-02-01 fmt --all
      - name: Run quick validation
        run: ./scripts/check-local.sh --quick
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Add scheduler-integrated endpoint waits"
          git push origin HEAD:agent/phase5-blocking-ipc
