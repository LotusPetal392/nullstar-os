name: Integrate VFS and ELF loader

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned formatter
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component rustfmt

      - name: Integrate VFS and ELF support
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/integrate_vfs_elf.py")
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines[:-1]):
              if line == "cat_and_diagnostics = block(":
                  lines[index + 1] = "    r'''"
                  break
          else:
              raise SystemExit("cat/ELF generator block was not found")
          path.write_text("\n".join(lines) + "\n")
          PY
          python3 tools/integrate_vfs_elf.py 2>&1 | tee integration.log
          cargo +nightly-2026-02-01 fmt --all 2>&1 | tee -a integration.log

      - name: Commit integration
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add kernel/src/main.rs kernel/src/shell.rs src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m "Integrate VFS and ELF validation"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vfs-elf-integration-log
          path: integration.log
          if-no-files-found: ignore
