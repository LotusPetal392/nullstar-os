name: Integrate userspace file I/O and launcher

on:
  push:
    branches:
      - agent/userspace-file-io-launcher

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/userspace-file-io-launcher

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Apply userspace file-I/O milestone
        shell: bash
        run: |
          set -o pipefail
          python3 tools/apply_userspace_file_io.py 2>&1 | tee userspace-file-io-integration.log

      - name: Format sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Generate workspace lockfile
        run: cargo +nightly-2026-02-01 generate-lockfile

      - name: Commit integrated sources
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add Cargo.lock build.rs kernel/src src/main.rs userspace
          if ! git diff --cached --quiet; then
            git commit -m "Add userspace file I/O and process launcher"
            git push origin HEAD:agent/userspace-file-io-launcher
          fi

      - name: Build bootable image
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 build --locked 2>&1 | tee userspace-file-io-build.log

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: userspace-file-io-integration-log
          path: userspace-file-io-integration.log
          if-no-files-found: ignore

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: userspace-file-io-build-log
          path: userspace-file-io-build.log
          if-no-files-found: ignore
