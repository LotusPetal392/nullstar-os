name: Kernel QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  qemu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Wait for AHCI port signature after COMRESET
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/src/drivers/ahci.rs")
          source = path.read_text()

          if "let mut signature_ready = false;" not in source:
              start = source.index("    fn wake_and_is_sata(self) -> bool {")
              end = source.index("    fn link_is_active(self) -> bool {", start)
              replacement = "\n".join([
                  "    fn wake_and_is_sata(self) -> bool {",
                  "        self.write(",
                  "            PORT_COMMAND,",
                  "            self.read(PORT_COMMAND) | PORT_CMD_SPIN_UP_DEVICE | PORT_CMD_POWER_ON_DEVICE,",
                  "        );",
                  "",
                  "        let sata_control = self.read(PORT_SATA_CONTROL);",
                  "        self.write(",
                  "            PORT_SATA_CONTROL,",
                  "            (sata_control & !SATA_CONTROL_DETECT_MASK) | SATA_CONTROL_COMRESET,",
                  "        );",
                  "        crate::interrupts::wait_for_timer_tick();",
                  "        self.write(PORT_SATA_CONTROL, sata_control & !SATA_CONTROL_DETECT_MASK);",
                  "        self.write(PORT_SATA_ERROR, u32::MAX);",
                  "",
                  "        let mut link_ready = false;",
                  "        for _ in 0..100 {",
                  "            if self.link_is_active() {",
                  "                link_ready = true;",
                  "                break;",
                  "            }",
                  "            crate::interrupts::wait_for_timer_tick();",
                  "        }",
                  "",
                  "        let mut signature_ready = false;",
                  "        if link_ready {",
                  "            for _ in 0..100 {",
                  "                let task_file = self.read(PORT_TASK_FILE_DATA);",
                  "                let signature = self.read(PORT_SIGNATURE);",
                  "                if task_file & (PORT_TFD_BUSY | PORT_TFD_DATA_REQUEST) == 0",
                  "                    && signature != u32::MAX",
                  "                {",
                  "                    signature_ready = true;",
                  "                    break;",
                  "                }",
                  "                crate::interrupts::wait_for_timer_tick();",
                  "            }",
                  "        }",
                  "",
                  "        let sata_status = self.read(PORT_SATA_STATUS);",
                  "        let signature = self.read(PORT_SIGNATURE);",
                  "        crate::serial_println!(",
                  "            \"AHCI port {}: ssts={:#010x}, sig={:#010x}, cmd={:#010x}, tfd={:#010x}\",",
                  "            self.index,",
                  "            sata_status,",
                  "            signature,",
                  "            self.read(PORT_COMMAND),",
                  "            self.read(PORT_TASK_FILE_DATA)",
                  "        );",
                  "",
                  "        link_ready && signature_ready && signature == SATA_DISK_SIGNATURE",
                  "    }",
                  "",
              ])
              source = source[:start] + replacement + source[end:]
              source = source.replace(
                  "const PORT_LINK_SPINS: usize = 2_000_000;\n",
                  "",
                  1,
              )
              path.write_text(source)
          PY
          cargo +nightly-2026-02-01 fmt --all

      - name: Commit AHCI port readiness fix
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add kernel/src/drivers/ahci.rs
          if ! git diff --cached --quiet; then
            git commit -m "Wait for AHCI port signature after COMRESET"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet qemu-system-x86

      - name: Build bootable image
        run: cargo +nightly-2026-02-01 build --locked --quiet

      - name: Boot AHCI smoke test in QEMU
        run: cargo +nightly-2026-02-01 run --locked --quiet -- --test
