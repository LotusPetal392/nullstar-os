name: Kernel QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: kernel-qemu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qemu-smoke-test:
    runs-on: ubuntu-latest
    # The suite keeps dependent boots ordered, while independent scenarios run
    # through a bounded worker pool inside the test runner.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Check formatting
        run: cargo +nightly-2026-02-01 fmt --all -- --check

      - name: Run kernel policy tests
        run: cargo +nightly-2026-02-01 test --locked -p kernel

      - name: Install QEMU
        run: |
          if ! sudo apt-get install --yes --quiet --no-install-recommends qemu-system-x86; then
            sudo apt-get update -qq
            sudo apt-get install --yes --quiet --no-install-recommends qemu-system-x86
          fi

      - name: Configure two-CPU QEMU acceptance environment
        shell: bash
        run: |
          set -euo pipefail
          wrapper_dir="$RUNNER_TEMP/nullstar-qemu-bin"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/qemu-system-x86_64" <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/qemu-system-x86_64 -smp 2 "$@"
          EOF
          chmod +x "$wrapper_dir/qemu-system-x86_64"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Build bootable image
        run: cargo +nightly-2026-02-01 build --release --locked --quiet

      - name: Boot two-CPU SMP scheduler-lane acceptance check
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 run --release --locked --quiet -- --boot-check 2>&1 | tee smp-qemu.log
          grep -F "application processor online: cpu=1" smp-qemu.log
          grep -F "SMP application processors online: candidates=1, attempted=1, online=1, failed=0" smp-qemu.log
          grep -F "application processor scheduler lane initialized: cpu=1" smp-qemu.log
          grep -F "application processor timer verified: cpu=1" smp-qemu.log
          grep -F "application processor reschedule IPI verified: cpu=1" smp-qemu.log
          grep -F "application processor kernel scheduling verified: cpu=1" smp-qemu.log

      - name: Boot partition, FAT, and SMP smoke test in QEMU
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 run --release --locked --quiet -- --test 2>&1 | tee partition-fat-qemu.log
          grep -F "application processor online: cpu=1" partition-fat-qemu.log
          grep -F "SMP application processors online: candidates=1, attempted=1, online=1, failed=0" partition-fat-qemu.log
          grep -F "application processor scheduler lane initialized: cpu=1" partition-fat-qemu.log
          grep -F "application processor timer verified: cpu=1" partition-fat-qemu.log
          grep -F "application processor reschedule IPI verified: cpu=1" partition-fat-qemu.log
          grep -F "application processor kernel scheduling verified: cpu=1" partition-fat-qemu.log

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-runtime-logs
          path: |
            smp-qemu.log
            partition-fat-qemu.log
          if-no-files-found: ignore
          retention-days: 7
