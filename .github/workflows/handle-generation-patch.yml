name: Apply handle generation documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/update-handle-generation-docs.py"
      - ".github/workflows/handle-generation-patch.yml"

permissions:
  contents: write

concurrency:
  group: handle-generation-docs
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: formal/handle-generation

      - name: Update authoritative documentation
        run: python3 scripts/update-handle-generation-docs.py

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "documentation already up to date"
            exit 0
          fi
          git config user.name "lotuspetalagent"
          git config user.email "305597532+lotuspetalagent@users.noreply.github.com"
          git add \
            docs/protection-model.md \
            docs/syscall-abi.md \
            docs/design/ipc-and-object-model.md
          git commit -m "Document generation-checked capability handles"
          git push origin HEAD:formal/handle-generation
