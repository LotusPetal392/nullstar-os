[workspace]
resolver = "3"
members = [
    "crates/nullfs-blockdev",
    "crates/nullfs-core",
    "crates/nullfs-format",
    "crates/nullfs-testkit",
    "crates/nullfs-userspace-blockdev",
    "crates/nswp-core",
    "kernel",
    "tools/fsck-nullfs",
    "tools/mkfs-nullfs",
    "tools/nullfs-fuse",
    "tools/nullfs-image",
    "tools/nullfs-info",
    "userspace",
    "userspace/nullfs-service",
]

[package]
name = "nullstar-os"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LotusPetal392/nullstar-os"

[build-dependencies]
bootloader = "0.11.15"
nullfs-blockdev = { path = "crates/nullfs-blockdev", features = ["memory"] }
nullfs-format = { path = "crates/nullfs-format" }
nullfs-testkit = { path = "crates/nullfs-testkit" }

kernel = {
    path = "kernel",
    artifact = "bin",
    target = "x86_64-unknown-none"
}

userspace = {
    path = "userspace",
    artifact = "bin",
    target = "x86_64-unknown-none"
}

nullfs-service = {
    path = "userspace/nullfs-service",
    artifact = "bin",
    target = "x86_64-unknown-none",
    features = ["freestanding"]
}

[profile.dev]
panic = "abort"

# Keep bootable dev disk images below BIOS/bootloader sector-count limits. The
# host runner can keep its default debuginfo; the no_std payloads are validated
# primarily through serial logs and smoke tests.
[profile.dev.package.kernel]
debug = 0

[profile.dev.package.userspace]
debug = 0

[profile.dev.package.nullfs-service]
debug = 0

[profile.release]
panic = "abort"
