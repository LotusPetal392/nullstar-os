name: Phase 5 formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase5-blocking-ipc
      - run: |
          rustup toolchain install nightly-2026-02-01 --profile minimal --component rustfmt
          cargo +nightly-2026-02-01 fmt --all
      - run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add --all
            git commit -m "Format Phase 5 blocking IPC changes"
            git push origin HEAD:agent/phase5-blocking-ipc
          fi
