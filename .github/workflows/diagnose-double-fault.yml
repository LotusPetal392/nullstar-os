name: Diagnose double fault address

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  addr2line:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-02-01 --profile minimal \
            --component llvm-tools-preview --component rust-src \
            --target x86_64-unknown-none

      - name: Build kernel with debug symbols
        run: cargo +nightly-2026-02-01 build --locked

      - name: Capture reported double-fault address mapping
        shell: bash
        run: |
          set -uo pipefail
          toolchain=$(rustc +nightly-2026-02-01 --print sysroot)
          addr2line=$(find "$toolchain" -type f -name llvm-addr2line | head -n 1)
          nm=$(find "$toolchain" -type f -name llvm-nm | head -n 1)
          objdump=$(find "$toolchain" -type f -name llvm-objdump | head -n 1)
          {
            echo "toolchain=$toolchain"
            echo "addr2line=$addr2line"
            echo "nm=$nm"
            echo "objdump=$objdump"
            echo "candidate files:"
            find target -type f \( -name 'kernel' -o -name 'kernel-*' \) -print
            while IFS= read -r candidate; do
              if file "$candidate" | grep -q 'ELF 64-bit'; then
                echo
                echo "=== $candidate ==="
                file "$candidate"
                "$addr2line" -f -C -e "$candidate" 0xaac24 || true
                "$nm" -n -C "$candidate" 2>/dev/null | awk '$1 >= "00000000000aa900" && $1 <= "00000000000aaf00" { print }' || true
                "$objdump" -d -C --start-address=0xaab40 --stop-address=0xaad20 "$candidate" 2>/dev/null || true
              fi
            done < <(find target -type f \( -name 'kernel' -o -name 'kernel-*' \) -print)
          } > double-fault-symbols.txt 2>&1
          cat double-fault-symbols.txt

      - name: Upload address diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: double-fault-symbols
          path: double-fault-symbols.txt
