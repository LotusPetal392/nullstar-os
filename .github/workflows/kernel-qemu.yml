name: Kernel QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qemu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Format sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Upload formatted sources
        uses: actions/upload-artifact@v6
        with:
          name: scheduler-rustfmt-sources
          path: |
            kernel/src
            src/main.rs

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet qemu-system-x86

      - name: Build bootable image
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 build --locked --quiet 2>&1 | tee scheduler-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduler-build-log
          path: scheduler-build.log
          if-no-files-found: ignore

      - name: Boot heap smoke test in QEMU
        run: cargo +nightly-2026-02-01 run --locked --quiet -- --test
