name: Apply generic pipeline launch milestone

on:
  push:
    branches:
      - agent/generic-pipeline-launch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generic-pipeline-launch
          fetch-depth: 0
      - name: Apply milestone patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_milestone.py
          python3 /tmp/apply_milestone.py
      - name: Format changed Rust sources
        run: cargo fmt --all
      - name: Commit milestone
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate pipelines to generic launch barriers"
          git push origin HEAD:agent/generic-pipeline-launch
