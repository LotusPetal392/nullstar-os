name: Apply bootstrap stack overflow fix

on:
  push:
    branches:
      - agent/multistage-userspace-pipelines

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/multistage-userspace-pipelines

      - name: Increase and validate the bootstrap kernel stack
        shell: python
        run: |
          from pathlib import Path

          path = Path("kernel/src/main.rs")
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              source = source.replace(old, new, 1)

          replace_once(
              "const BOOTLOADER_MINIMUM_PHYSICAL_MAPPING_END: u64 = 0x1_0000_0000;\n",
              "const BOOTLOADER_MINIMUM_PHYSICAL_MAPPING_END: u64 = 0x1_0000_0000;\n"
              "// The interactive kernel shell synchronously services userspace process-control\n"
              "// requests on the bootstrap stack, so reserve explicit headroom beyond the\n"
              "// bootloader's 80 KiB default.\n"
              "const BOOTSTRAP_KERNEL_STACK_SIZE: u64 = 256 * 1024;\n",
          )
          replace_once(
              "    config.mappings.physical_memory = Some(Mapping::Dynamic);\n    config\n",
              "    config.mappings.physical_memory = Some(Mapping::Dynamic);\n"
              "    config.kernel_stack_size = BOOTSTRAP_KERNEL_STACK_SIZE;\n"
              "    config\n",
          )
          replace_once(
              "    let rsdp_address = boot_info.rsdp_addr.into_option();\n\n    let mut mapper",
              "    let rsdp_address = boot_info.rsdp_addr.into_option();\n"
              "    let bootstrap_stack_bottom = boot_info.kernel_stack_bottom;\n"
              "    let bootstrap_stack_len = boot_info.kernel_stack_len;\n"
              "    let Some(bootstrap_stack_top) =\n"
              "        bootstrap_stack_bottom.checked_add(bootstrap_stack_len)\n"
              "    else {\n"
              "        serial_println!(\"bootstrap kernel stack address overflowed\");\n"
              "        hlt_loop();\n"
              "    };\n"
              "    if bootstrap_stack_len < BOOTSTRAP_KERNEL_STACK_SIZE {\n"
              "        serial_println!(\n"
              "            \"bootstrap kernel stack is too small: configured={}, provided={}\",\n"
              "            BOOTSTRAP_KERNEL_STACK_SIZE,\n"
              "            bootstrap_stack_len\n"
              "        );\n"
              "        hlt_loop();\n"
              "    }\n"
              "    serial_println!(\n"
              "        \"bootstrap kernel stack initialized: bottom={:#x}, top={:#x}, bytes={}\",\n"
              "        bootstrap_stack_bottom,\n"
              "        bootstrap_stack_top,\n"
              "        bootstrap_stack_len\n"
              "    );\n\n"
              "    let mut mapper",
          )

          path.write_text(source)
          Path(".github/workflows/diagnose-double-fault.yml").unlink()

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-02-01 --profile minimal \
            --component llvm-tools-preview --component rust-src --component rustfmt \
            --target x86_64-unknown-none

      - name: Format and validate the product tree
        run: |
          cargo +nightly-2026-02-01 fmt --all
          cargo +nightly-2026-02-01 fmt --all -- --check
          git diff --check

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Build and boot the full smoke test
        run: cargo +nightly-2026-02-01 run --locked -- --test

      - name: Commit and push the fix
        run: |
          git config user.name lotuspetalagent
          git config user.email lotuspetalagent@users.noreply.github.com
          git add kernel/src/main.rs .github/workflows/diagnose-double-fault.yml
          git commit -m "Increase bootstrap kernel stack"
          git push origin HEAD:agent/multistage-userspace-pipelines
