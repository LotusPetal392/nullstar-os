name: Apply handle generation implementation

on:
  push:
    branches:
      - formal/handle-generation
    paths:
      - "scripts/fix-handle-generation-main.py"
      - ".github/workflows/handle-generation-patch.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/fix-handle-generation-main.py"
      - ".github/workflows/handle-generation-patch.yml"

permissions:
  contents: write

concurrency:
  group: handle-generation-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: formal/handle-generation

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Fix PID 1 bootstrap grant comparisons
        run: python3 scripts/fix-handle-generation-main.py

      - name: Format patched sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Check diff whitespace
        run: git diff --check

      - name: Run kernel tests
        run: cargo +nightly-2026-02-01 test --locked -p kernel

      - name: Build complete release image
        run: cargo +nightly-2026-02-01 build --release --locked --quiet

      - name: Commit implementation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lotuspetalagent"
          git config user.email "305597532+lotuspetalagent@users.noreply.github.com"
          git add userspace/src/main.rs
          git commit -m "Fix bootstrap slot grant validation"
          git push origin HEAD:formal/handle-generation
