name: Attach q35 AHCI boot disk

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned formatter
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component rustfmt

      - name: Attach boot disk to AHCI port
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main.rs")
          source = path.read_text()
          old = '''    command
              .args(["-machine", "q35"])
              .arg("-drive")
              .arg(format!("format=raw,file={bios_image}"))
              .args(["-serial", "stdio", "-monitor", "none", "-m", "128M"]);
          '''
          new = '''    command
              .args(["-machine", "q35"])
              .arg("-drive")
              .arg(format!(
                  "if=none,id=bootdisk,format=raw,file={bios_image}"
              ))
              .args([
                  "-device",
                  "ide-hd,drive=bootdisk,bus=ide.0,bootindex=1",
              ])
              .args(["-serial", "stdio", "-monitor", "none", "-m", "128M"]);
          '''
          if old not in source:
              raise SystemExit("QEMU drive snippet was not found")
          path.write_text(source.replace(old, new, 1))
          PY
          cargo +nightly-2026-02-01 fmt --all

      - name: Commit launcher fix
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add src/main.rs
          git commit -m "Attach boot disk to q35 AHCI controller"
          git push origin HEAD:${{ github.head_ref }}
