name: Validate userspace descriptor pipelines

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/userspace-pipelines

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Confirm userspace descriptor pipeline milestone
        shell: bash
        run: |
          set +e
          set -o pipefail
          if grep -q '^const SYSCALL_PIPE_PAIR: u64 = 10;$' kernel/src/process/userspace.rs; then
            echo "userspace descriptor pipeline milestone already integrated" | tee userspace-pipelines-apply.log
            status=0
          else
            python3 tools/apply_userspace_pipelines.py 2>&1 | tee userspace-pipelines-apply.log
            status=${PIPESTATUS[0]}
          fi
          exit "$status"

      - name: Format sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Preserve pinned dependency lockfile
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- Cargo.lock

      - name: Commit integrated sources
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add Cargo.lock kernel/src/main.rs kernel/src/process kernel/src/shell.rs src/main.rs userspace/src/bin/ush.rs
          if ! git diff --cached --quiet; then
            git commit -m "Format userspace descriptor pipelines"
            git push origin HEAD:agent/userspace-pipelines
          fi

      - name: Build bootable image
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 build --locked 2>&1 | tee userspace-pipelines-build.log

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: userspace-pipelines-integration-log
          path: |
            userspace-pipelines-apply.log
            userspace-pipelines-build.log
            tools/userspace_pipelines_payload.txt
          if-no-files-found: error
