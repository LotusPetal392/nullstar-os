name: Apply handle generation implementation

on:
  push:
    branches:
      - formal/handle-generation
    paths:
      - "scripts/apply-handle-generation.py"
      - ".github/workflows/handle-generation-patch.yml"

permissions:
  contents: write

concurrency:
  group: handle-generation-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage handle generation implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: formal/handle-generation

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt \
            --component clippy
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Apply generation-checked handle patch
        run: python3 scripts/apply-handle-generation.py

      - name: Format patched sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Check diff whitespace
        run: git diff --check

      - name: Run kernel tests
        run: cargo +nightly-2026-02-01 test --locked -p kernel

      - name: Build complete release image
        run: cargo +nightly-2026-02-01 build --release --locked --quiet

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lotuspetalagent"
          git config user.email "305597532+lotuspetalagent@users.noreply.github.com"
          git add \
            shared/userspace_abi.rs \
            shared/protection_abi.rs \
            kernel/src/capability.rs \
            kernel/src/process/userspace_platform/capability_entry.rs \
            kernel/src/process/userspace_platform/capability_grant_entry.rs \
            userspace/src/ipc.rs \
            userspace/src/handle.rs \
            userspace/src/process_start.rs \
            userspace/src/syscall_facade.rs \
            userspace/src/managed_startup.rs \
            userspace/src/bin/definition_service_probe.rs \
            userspace/src/main.rs
          git commit -m "Implement generation-checked capability handles"
          git push origin HEAD:formal/handle-generation
