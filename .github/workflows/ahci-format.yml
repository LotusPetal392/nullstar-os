name: Format AHCI storage sources

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned formatter
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component rustfmt

      - name: Format sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Commit formatted sources
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add kernel/src src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m "Format AHCI block storage sources"
            git push origin HEAD:${{ github.head_ref }}
          fi
