name: Integrate userspace process-control shell

on:
  push:
    branches:
      - agent/userspace-shell

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/userspace-shell

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Apply userspace shell milestone
        run: python3 tools/apply_userspace_shell.py

      - name: Format sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Preserve pinned dependency lockfile
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- Cargo.lock

      - name: Commit integrated sources
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add Cargo.lock build.rs kernel/src src/main.rs userspace
          if ! git diff --cached --quiet; then
            git commit -m "Add userspace process-control shell"
            git push origin HEAD:agent/userspace-shell
          fi

      - name: Build bootable image
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 build --locked 2>&1 | tee userspace-shell-build.log

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: userspace-shell-build-log
          path: userspace-shell-build.log
          if-no-files-found: ignore
