name: Validate userspace pipes

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/userspace-pipes

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Check formatting
        run: cargo +nightly-2026-02-01 fmt --all -- --check

      - name: Verify pinned dependency lockfile
        run: |
          git fetch origin main --depth=1
          test "$(git hash-object Cargo.lock)" = "$(git show origin/main:Cargo.lock | git hash-object --stdin)"

      - name: Build bootable image
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 build --locked 2>&1 | tee userspace-pipes-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: userspace-pipes-build-log
          path: userspace-pipes-build.log
          if-no-files-found: ignore
