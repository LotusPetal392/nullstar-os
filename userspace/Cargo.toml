[package]
name = "userspace"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LotusPetal392/nullstar-os"
build = "build.rs"

[dependencies]
boot-generation = { path = "../crates/boot-generation" }
nullfs-format = { path = "../crates/nullfs-format" }
nswp-core = { path = "../crates/nswp-core" }
nswp-logging = { path = "../crates/nswp-logging" }
nswp-runtime = { path = "../crates/nswp-runtime" }
service-control = { path = "../crates/service-control" }
service-definition = { path = "../crates/service-definition" }
service-route = { path = "../crates/service-route" }

