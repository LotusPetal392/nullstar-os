name: Kernel QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  qemu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Format Rust sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Commit formatting changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel/src/allocator.rs kernel/src/main.rs src/main.rs
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "Format heap allocator changes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet qemu-system-x86

      - name: Build bootable image
        run: cargo +nightly-2026-02-01 build --locked --quiet

      - name: Boot heap smoke test in QEMU
        run: cargo +nightly-2026-02-01 run --locked --quiet -- --test
