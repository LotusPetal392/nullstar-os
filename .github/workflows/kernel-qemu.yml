name: Kernel QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  qemu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Complete initial kernel-thread interrupt frames
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/src/scheduler.rs")
          source = path.read_text()
          source = source.replace(
              "segmentation::{CS, Segment},",
              "segmentation::{CS, SS, Segment},",
              1,
          )
          source = source.replace(
              "            rflags: INITIAL_RFLAGS,\n        };",
              "            rflags: INITIAL_RFLAGS,\n"
              "            stack_pointer: stack_end as u64,\n"
              "            stack_segment: u64::from(SS::get_reg().0),\n"
              "        };",
              1,
          )
          source = source.replace(
              "    rflags: u64,\n}",
              "    rflags: u64,\n"
              "    stack_pointer: u64,\n"
              "    stack_segment: u64,\n"
              "}",
              1,
          )
          path.write_text(source)
          PY
          cargo +nightly-2026-02-01 fmt --all

      - name: Commit complete thread frames
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add kernel/src/scheduler.rs
          if ! git diff --cached --quiet; then
            git commit -m "Complete kernel thread interrupt frames"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet qemu-system-x86

      - name: Build bootable image
        run: cargo +nightly-2026-02-01 build --locked --quiet

      - name: Boot scheduler smoke test in QEMU
        run: cargo +nightly-2026-02-01 run --locked --quiet -- --test
