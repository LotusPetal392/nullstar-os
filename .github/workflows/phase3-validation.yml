name: Phase 3 validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component clippy \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt \
            --target x86_64-unknown-none
      - name: Apply rustfmt
        run: cargo +nightly-2026-02-01 fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add --all
            git commit -m "Format Phase 3 tmpfs changes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run quick validation
        run: ./scripts/check-local.sh --quick
