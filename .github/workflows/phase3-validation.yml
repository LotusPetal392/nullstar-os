name: Phase 3 validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component clippy \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt \
            --target x86_64-unknown-none
      - name: Apply mechanical fixes and rustfmt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path("userspace/src/bin/tmpfs_service.rs")
          text = service.read_text()
          text = text.replace("usize::from(cursor != 0)", "if cursor != 0 { 1 } else { 0 }")
          text = text.replace("name.iter().any(|byte| *byte == b'/')", "name.contains(&b'/')")
          service.write_text(text)

          client = Path("userspace/src/tmpfs.rs")
          text = client.read_text()
          text = text.replace(
              "let mut request = named(protocol::operation::WRITE, name)?;\n    request.data_length = bytes.len() as u16;\n    request.data[..bytes.len()].copy_from_slice(bytes);\n    request(service, &request)",
              "let mut request_value = named(protocol::operation::WRITE, name)?;\n    request_value.data_length = bytes.len() as u16;\n    request_value.data[..bytes.len()].copy_from_slice(bytes);\n    request(service, &request_value)",
          )
          text = text.replace("name.iter().any(|byte| *byte == b'/')", "name.contains(&b'/')")
          client.write_text(text)
          PY
          cargo +nightly-2026-02-01 fmt --all
      - name: Commit fixes
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add --all
            git commit -m "Fix and format Phase 3 tmpfs changes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run quick validation
        shell: bash
        run: |
          set -o pipefail
          ./scripts/check-local.sh --quick 2>&1 | tee phase3-validation.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase3-validation-log
          path: phase3-validation.log
          if-no-files-found: warn
