name: Integrate userspace pipes

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/userspace-pipes

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Apply userspace pipe milestone
        run: |
          if grep -q '^pub(crate) mod pipe;$' kernel/src/process/mod.rs; then
            echo "pipe milestone already integrated"
          else
            python3 tools/apply_pipe_model.py
            python3 tools/apply_pipe_syscalls.py
            python3 tools/apply_pipe_integration.py
            python3 tools/apply_pipe_runner.py
          fi

      - name: Format sources
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Generate workspace lockfile
        run: cargo +nightly-2026-02-01 generate-lockfile

      - name: Commit integrated sources
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add Cargo.lock build.rs kernel/src src/main.rs userspace
          if ! git diff --cached --quiet; then
            git commit -m "Add blocking userspace pipes"
            git push origin HEAD:agent/userspace-pipes
          fi

      - name: Build bootable image
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 build --locked 2>&1 | tee userspace-pipes-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: userspace-pipes-build-log
          path: userspace-pipes-build.log
          if-no-files-found: ignore
