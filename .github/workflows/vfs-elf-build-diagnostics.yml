name: VFS and ELF build diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Fix VFS directory-entry ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/src/vfs/mod.rs")
          source = path.read_text()
          old = '''            .map(|entry| DirectoryEntry {
                name: entry.name,
                kind: if entry.is_directory() {
                    NodeKind::Directory
                } else {
                    NodeKind::File
                },
                size: u64::from(entry.size),
                read_only: entry.is_read_only(),
                hidden: entry.is_hidden(),
                system: entry.is_system(),
            })
          '''
          new = '''            .map(|entry| {
                let kind = if entry.is_directory() {
                    NodeKind::Directory
                } else {
                    NodeKind::File
                };
                let size = u64::from(entry.size);
                let read_only = entry.is_read_only();
                let hidden = entry.is_hidden();
                let system = entry.is_system();
                DirectoryEntry {
                    name: entry.name,
                    kind,
                    size,
                    read_only,
                    hidden,
                    system,
                }
            })
          '''
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit("VFS directory-entry conversion was not found")
          PY
          cargo +nightly-2026-02-01 fmt --all

      - name: Commit ownership fix
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add kernel/src/vfs/mod.rs
          if ! git diff --cached --quiet; then
            git commit -m "Fix VFS directory entry ownership"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Capture build output
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 build --locked 2>&1 | tee vfs-elf-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vfs-elf-build-log
          path: vfs-elf-build.log
          if-no-files-found: ignore
