name: Phase 1 quick validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  quick-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component clippy \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt \
            --target x86_64-unknown-none
      - name: Apply Clippy's mechanical collection fix
        id: collection-fix
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("kernel/src/process/userspace_platform/capability_entry.rs")
          text = path.read_text()
          old = "reachable.iter().any(|object| *object == record.reference)"
          new = "reachable.contains(&record.reference)"
          changed = old in text
          if changed:
              text = text.replace(old, new, 1)
              path.write_text(text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
          PY
          cargo +nightly-2026-02-01 fmt --all
      - name: Commit mechanical fix
        if: steps.collection-fix.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kernel/src/process/userspace_platform/capability_entry.rs
          git commit -m "Use slice contains in capability GC"
          git push origin HEAD:${{ github.head_ref }}
      - name: Run host tests, Clippy, and release build
        shell: bash
        run: |
          set -o pipefail
          ./scripts/check-local.sh --quick 2>&1 | tee phase1-quick-validation.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase1-quick-validation-log
          path: phase1-quick-validation.log
          if-no-files-found: warn
