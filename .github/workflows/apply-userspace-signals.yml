name: Apply userspace process groups and signals

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/userspace-signals

      - name: Decode and apply process-group integration
        shell: bash
        run: |
          set -euo pipefail
          cat tools/userspace_signals_payload.part0 > /tmp/userspace-signals.b64
          cat >> /tmp/userspace-signals.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/userspace-signals.b64 | gzip --decompress > tools/apply_userspace_signals.py
          python tools/apply_userspace_signals.py
          rm tools/userspace_signals_payload.part0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-02-01 --profile minimal \
            --component llvm-tools-preview --component rust-src --component rustfmt \
            --target x86_64-unknown-none

      - name: Format and validate
        run: |
          cargo +nightly-2026-02-01 fmt --all
          cargo +nightly-2026-02-01 fmt --all -- --check
          git diff --check

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Build and boot the full smoke test
        run: cargo +nightly-2026-02-01 run --locked -- --test

      - name: Commit and push product changes
        run: |
          git config user.name lotuspetalagent
          git config user.email lotuspetalagent@users.noreply.github.com
          git add -A
          git commit -m "Add userspace process groups and signals"
          git push origin HEAD:agent/userspace-signals
