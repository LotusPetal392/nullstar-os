name: Application launch branch validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/fix-application-launch.py"
      - ".github/workflows/application-launch-fix.yml"
  push:
    branches:
      - feature/application-launch-foundation
    paths:
      - "scripts/fix-application-launch.py"
      - ".github/workflows/application-launch-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/application-launch-foundation
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Apply application launch fixes
        run: python3 scripts/fix-application-launch.py

      - name: Format workspace
        run: cargo +nightly-2026-02-01 fmt --all

      - name: Check whitespace
        run: git diff --check

      - name: Run userspace host tests
        run: cargo +nightly-2026-02-01 test --locked -p userspace

      - name: Build release image
        run: cargo +nightly-2026-02-01 build --release --locked --quiet

      - name: Commit validated source
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- userspace/src/application_launch.rs userspace/src/lib.rs; then
            exit 0
          fi
          git config user.name "lotuspetalagent"
          git config user.email "305597532+lotuspetalagent@users.noreply.github.com"
          git add userspace/src/application_launch.rs userspace/src/lib.rs
          git commit -m "fix(userspace): validate application launch foundation"
          git push origin HEAD:feature/application-launch-foundation
