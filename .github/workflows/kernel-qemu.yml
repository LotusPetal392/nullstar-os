name: Kernel QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  qemu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt
          rustup -q target add x86_64-unknown-none --toolchain nightly-2026-02-01

      - name: Select active AHCI link before device identification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/src/drivers/ahci.rs")
          source = path.read_text()

          if "fn wake_and_has_device(self) -> bool" not in source:
              start = source.index("    fn wake_and_is_sata(self) -> bool {")
              end = source.index("    fn link_is_active(self) -> bool {", start)
              replacement = "\n".join([
                  "    fn wake_and_has_device(self) -> bool {",
                  "        self.write(",
                  "            PORT_COMMAND,",
                  "            self.read(PORT_COMMAND) | PORT_CMD_SPIN_UP_DEVICE | PORT_CMD_POWER_ON_DEVICE,",
                  "        );",
                  "",
                  "        let sata_control = self.read(PORT_SATA_CONTROL);",
                  "        self.write(",
                  "            PORT_SATA_CONTROL,",
                  "            (sata_control & !SATA_CONTROL_DETECT_MASK) | SATA_CONTROL_COMRESET,",
                  "        );",
                  "        crate::interrupts::wait_for_timer_tick();",
                  "        self.write(PORT_SATA_CONTROL, sata_control & !SATA_CONTROL_DETECT_MASK);",
                  "        self.write(PORT_SATA_ERROR, u32::MAX);",
                  "",
                  "        let mut link_ready = false;",
                  "        for _ in 0..100 {",
                  "            if self.link_is_active() {",
                  "                link_ready = true;",
                  "                break;",
                  "            }",
                  "            crate::interrupts::wait_for_timer_tick();",
                  "        }",
                  "",
                  "        crate::serial_println!(",
                  "            \"AHCI port {}: ssts={:#010x}, sig={:#010x}, cmd={:#010x}, tfd={:#010x}\",",
                  "            self.index,",
                  "            self.read(PORT_SATA_STATUS),",
                  "            self.read(PORT_SIGNATURE),",
                  "            self.read(PORT_COMMAND),",
                  "            self.read(PORT_TASK_FILE_DATA)",
                  "        );",
                  "",
                  "        link_ready",
                  "    }",
                  "",
              ])
              source = source[:start] + replacement + source[end:]
              source = source.replace(
                  "if port.wake_and_is_sata() {",
                  "if port.wake_and_has_device() {",
                  1,
              )
              source = source.replace(
                  "const SATA_DISK_SIGNATURE: u32 = 0x0000_0101;\n",
                  "",
                  1,
              )
              path.write_text(source)
          PY
          cargo +nightly-2026-02-01 fmt --all

      - name: Commit AHCI active-link selection
        run: |
          git config user.name "lotuspetalagent"
          git config user.email "lotuspetalagent@users.noreply.github.com"
          git add kernel/src/drivers/ahci.rs
          if ! git diff --cached --quiet; then
            git commit -m "Identify devices after AHCI port setup"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet qemu-system-x86

      - name: Build bootable image
        run: cargo +nightly-2026-02-01 build --locked --quiet

      - name: Boot AHCI smoke test in QEMU
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 run --locked --quiet -- --test 2>&1 | tee ahci-qemu.log

      - name: Upload AHCI smoke-test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ahci-smoke-log
          path: ahci-qemu.log
          if-no-files-found: ignore
