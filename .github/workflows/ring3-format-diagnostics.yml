name: Ring 3 formatting diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request merge ref
        uses: actions/checkout@v7

      - name: Install pinned formatter
        run: |
          rustup -q toolchain install nightly-2026-02-01 \
            --profile minimal \
            --component rustfmt

      - name: Capture formatting diff
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly-2026-02-01 fmt --all -- --check 2>&1 | tee ring3-format.log

      - name: Upload formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ring3-format-log
          path: ring3-format.log
          if-no-files-found: ignore
